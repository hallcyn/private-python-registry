name: Check upstream versions

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-versions.yml'
      - 'scripts/check_versions.py'
      - 'tests/test_versions.py'
      - 'requirements.txt'
      - 'Dockerfile'
  pull_request:
    paths:
      - '.github/workflows/check-versions.yml'
      - 'scripts/check_versions.py'
      - 'tests/test_versions.py'
      - 'requirements.txt'
      - 'Dockerfile'

permissions:
  contents: read

concurrency:
  group: versions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'packaging>=24,<27'
      - run: python -m unittest discover -s tests -p 'test_versions.py' -v

  monitor:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'packaging>=24,<27'
      - name: Check PyPI releases and maintain update issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_versions.py --write-issues
